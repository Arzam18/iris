name: Build Iris for Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Patch Makefile and Build Iris ARM64
        run: |
          # 1. Find the Makefile
          MAKEFILE_PATH=$(find . -iname "makefile" | head -n 1)

          if [ -z "$MAKEFILE_PATH" ]; then
            echo "Error: No Makefile found in repository!"
            exit 1
          fi

          echo "Found Makefile at: $MAKEFILE_PATH"
          MAKE_DIR=$(dirname "$MAKEFILE_PATH")

          # 2. Patch Makefile for Cross-Compilation & Clang Compatibility
          # Replace x86 optimization with ARM64 AND inject flags to silence strict Clang warnings
          sed -i 's/-march=native/-march=armv8-a -Wno-error -Wno-missing-braces/g' "$MAKEFILE_PATH"
          
          # Remove -Werror entirely so harmless warnings don't crash the compile
          sed -i 's/-Werror//g' "$MAKEFILE_PATH"

          # 3. Set up the Android NDK Clang compiler path for ARM64 (API 24)
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"

          # 4. Build Iris by explicitly passing the NDK compiler to the make command
          cd "$MAKE_DIR"
          make CXX="$CXX"

          # 5. Move binary to workspace root
          if [ -f "iris" ]; then
            mv iris "${{ github.workspace }}/iris"
          else
            echo "Binary 'iris' not found! Build failed."
            exit 1
          fi

      - name: Verify Binary Architecture
        run: |
          file iris

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: iris-android-arm64
          path: iris
