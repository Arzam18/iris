name: Build Iris for Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Patch Code and Build Iris ARM64
        run: |
          # 1. Find the Makefile
          MAKEFILE_PATH=$(find . -iname "makefile" | head -n 1)

          if [ -z "$MAKEFILE_PATH" ]; then
            echo "Error: No Makefile found in repository!"
            exit 1
          fi

          echo "Found Makefile at: $MAKEFILE_PATH"
          MAKE_DIR=$(dirname "$MAKEFILE_PATH")

          # 2. Patch Makefile for Cross-Compilation & Clang Compatibility
          sed -i 's/-march=native/-march=armv8-a -Wno-error -Wno-missing-braces/g' "$MAKEFILE_PATH"
          sed -i 's/-Werror//g' "$MAKEFILE_PATH"

          # 3. Patch perft.h to fix the 64-bit integer type mismatch on ARM64
          # We cast both arguments inside std::max to 'long long' (1LL) so the compiler stops panicking
          find . -name "perft.h" -exec sed -i 's/std::max(time, i64(1))/std::max((long long)time, 1LL)/g' {} +

          # 4. Set up the Android NDK Clang compiler path for ARM64
          # Bumped to API 28 because Android natively supports std::aligned_alloc starting at API 28
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android28-clang++"

          # 5. Build Iris by explicitly passing the NDK compiler
          cd "$MAKE_DIR"
          make CXX="$CXX"

          # 6. Move binary to workspace root
          if [ -f "iris" ]; then
            mv iris "${{ github.workspace }}/iris"
          else
            echo "Binary 'iris' not found! Build failed."
            exit 1
          fi

      - name: Verify Binary Architecture
        run: |
          file iris

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: iris-android-arm64
          path: iris
